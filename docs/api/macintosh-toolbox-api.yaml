# Macintosh Toolbox & QuickDraw API Reference
# Structured API spec for original Mac OS (Inside Macintosh; System 6/7).
# Machine-readable; single source of truth for Toolbox and QuickDraw APIs.

title: "Macintosh Toolbox & QuickDraw API Reference"
version: "1.0"
source: "Inside Macintosh; Original Mac OS System 6/7"
specVersion: "1.0"

# ---------------------------------------------------------------------------
# QuickDraw (Basic)
# ---------------------------------------------------------------------------
quickdraw:
  description: |
    The foundational imaging engine for all Macintosh computers. Performs graphics
    operations (lines, shapes, text, pictures) directly to the screen. All drawing
    uses a current GrafPort; applications call SetPort to designate the target.

  types:
    - name: GrafVerb
      kind: integer
      description: "Drawing verb for shape-drawing procedures: 0=frame, 1=paint, 2=erase, 3=invert, 4=fill"
    - name: Pattern
      kind: type
      description: "8-byte packed 1-bit bitmap for fill/pen/background; each byte is one row of 8 pixels"
    - name: Point
      kind: record
      description: "2-D coordinate in QuickDraw local port space; v (vertical) before h (horizontal)"
      fields:
        - { name: v, type: Integer, description: "Vertical coordinate (y)" }
        - { name: h, type: Integer, description: "Horizontal coordinate (x)" }
    - name: Rect
      kind: record
      description: "Axis-aligned rectangle; half-open convention (top/left inside, bottom/right outside)"
      fields:
        - { name: top, type: Integer }
        - { name: left, type: Integer }
        - { name: bottom, type: Integer }
        - { name: right, type: Integer }
    - name: BitMap
      kind: record
      description: "1-bit-per-pixel bitmap (screen or offscreen)"
      fields:
        - { name: baseAddr, type: Ptr }
        - { name: rowBytes, type: Integer }
        - { name: bounds, type: Rect }
    - name: Cursor
      kind: record
      description: "16x16 1-bit cursor sprite (data, mask, hotSpot)"
      fields:
        - { name: data, type: Bits16 }
        - { name: mask, type: Bits16 }
        - { name: hotSpot, type: Point }
    - name: PenState
      kind: record
      description: "Snapshot of current port pen attributes"
      fields:
        - { name: pnLoc, type: Point }
        - { name: pnSize, type: Point }
        - { name: pnMode, type: Integer }
        - { name: pnPat, type: Pattern }
    - name: Polygon
      kind: record
      description: "Closed polygon as ordered list of vertices"
      fields:
        - { name: polySize, type: Integer }
        - { name: polyBBox, type: Rect }
        - { name: polyPoints, type: "Array of Point" }
    - name: PolyHandle
      kind: handle
      baseType: Polygon
      description: "Indirect reference to a Polygon"
    - name: Region
      kind: record
      description: "Arbitrary 1-bit mask region (bounding box + scanlines)"
      fields:
        - { name: rgnSize, type: Integer }
        - { name: rgnBBox, type: Rect }
        - { name: scanlines, type: "Optional array" }
    - name: RgnHandle
      kind: handle
      baseType: Region
      description: "Handle to a Region"
    - name: Picture
      kind: record
      description: "Recorded sequence of QuickDraw operations (metafile)"
      fields:
        - { name: picSize, type: Integer }
        - { name: picFrame, type: Rect }
        - { name: _data, type: "Byte stream" }
    - name: PicHandle
      kind: handle
      baseType: Picture
      description: "Handle to a Picture"
    - name: FontInfo
      kind: record
      description: "Vertical metrics for current font (ascent, descent, widMax, leading)"
      fields:
        - { name: ascent, type: Integer }
        - { name: descent, type: Integer }
        - { name: widMax, type: Integer }
        - { name: leading, type: Integer }
    - name: QDProcs
      kind: record
      description: "Bottleneck record — function pointers that intercept drawing primitives"
      fields:
        - { name: textProc, type: ProcPtr }
        - { name: lineProc, type: ProcPtr }
        - { name: rectProc, type: ProcPtr }
        - { name: rRectProc, type: ProcPtr }
        - { name: ovalProc, type: ProcPtr }
        - { name: arcProc, type: ProcPtr }
        - { name: polyProc, type: ProcPtr }
        - { name: rgnProc, type: ProcPtr }
        - { name: bitsProc, type: ProcPtr }
        - { name: commentProc, type: ProcPtr }
        - { name: txMeasProc, type: ProcPtr }
        - { name: getPicProc, type: ProcPtr }
        - { name: putPicProc, type: ProcPtr }
    - name: GrafPort
      kind: record
      description: "Central drawing context; first field of WindowRecord so WindowPtr = GrafPtr"
      fields:
        - { name: device, type: Integer }
        - { name: portBits, type: BitMap }
        - { name: portRect, type: Rect }
        - { name: visRgn, type: RgnHandle }
        - { name: clipRgn, type: RgnHandle }
        - { name: bkPat, type: Pattern }
        - { name: fillPat, type: Pattern }
        - { name: pnLoc, type: Point }
        - { name: pnSize, type: Point }
        - { name: pnMode, type: Integer }
        - { name: pnPat, type: Pattern }
        - { name: pnVis, type: Integer }
        - { name: txFont, type: Integer }
        - { name: txFace, type: Style }
        - { name: txMode, type: Integer }
        - { name: txSize, type: Integer }
        - { name: spExtra, type: Fixed }
        - { name: fgColor, type: Integer }
        - { name: bkColor, type: Integer }
        - { name: colrBit, type: Integer }
        - { name: patStretch, type: Integer }
        - { name: picSave, type: PicHandle }
        - { name: rgnSave, type: RgnHandle }
        - { name: polySave, type: PolyHandle }
        - { name: grafProcs, type: QDProcs }
    - name: GrafPtr
      kind: type
      description: "Pointer to GrafPort; same as WindowPtr when referring to window's port"
    - name: Style
      kind: integer
      description: "Bitfield of text style flags (bold, italic, underline, outline, shadow, condense, extend)"

  constants:
    # Transfer modes
    - { name: srcCopy, value: 0, description: "Copy source to destination" }
    - { name: srcOr, value: 1 }
    - { name: srcXor, value: 2 }
    - { name: srcBic, value: 3 }
    - { name: notSrcCopy, value: 4 }
    - { name: notSrcOr, value: 5 }
    - { name: notSrcXor, value: 6 }
    - { name: notSrcBic, value: 7 }
    - { name: patCopy, value: 8 }
    - { name: patOr, value: 9 }
    - { name: patXor, value: 10 }
    - { name: patBic, value: 11 }
    - { name: notPatCopy, value: 12 }
    - { name: notPatOr, value: 13 }
    - { name: notPatXor, value: 14 }
    - { name: notPatBic, value: 15 }
    # Color bits
    - { name: normalBit, value: 0 }
    - { name: inverseBit, value: 1 }
    - { name: redBit, value: 4 }
    - { name: greenBit, value: 3 }
    - { name: blueBit, value: 2 }
    - { name: cyanBit, value: 8 }
    - { name: magentaBit, value: 7 }
    - { name: yellowBit, value: 6 }
    - { name: blackBit, value: 5 }
    # Colors
    - { name: blackColor, value: 33 }
    - { name: whiteColor, value: 30 }
    - { name: redColor, value: 205 }
    - { name: greenColor, value: 341 }
    - { name: blueColor, value: 409 }
    - { name: cyanColor, value: 273 }
    - { name: magentaColor, value: 137 }
    - { name: yellowColor, value: 69 }
    # Picture comments
    - { name: picLParen, value: 0 }
    - { name: picRParen, value: 1 }
    # GrafVerb
    - { name: FRAME, value: 0, description: "Outline only" }
    - { name: PAINT, value: 1, description: "Fill with pen pattern" }
    - { name: ERASE, value: 2, description: "Fill with background pattern" }
    - { name: INVERT, value: 3, description: "XOR pixels" }
    - { name: FILL, value: 4, description: "Fill with explicit pattern" }
    # Style flags
    - { name: bold, value: 0x01 }
    - { name: italic, value: 0x02 }
    - { name: underline, value: 0x04 }
    - { name: outline, value: 0x08 }
    - { name: shadow, value: 0x10 }
    - { name: condense, value: 0x20 }
    - { name: extend, value: 0x40 }

  routines:
    # Initialization & GrafPort
    - name: InitGraf
      category: initialization
      description: "Initialize QuickDraw with screen bitmap"
      signature: "PROCEDURE InitGraf(screen: QDScreen)"
      parameters: [{ name: screen, type: QDScreen, direction: in }]
      returnType: void
    - name: OpenPort
      category: port
      description: "Initialize and open a GrafPort (allocate regions, set defaults)"
      signature: "PROCEDURE OpenPort(port: GrafPtr)"
      parameters: [{ name: port, type: GrafPtr, direction: inout }]
      returnType: void
    - name: InitPort
      category: port
      description: "Initialize port fields without allocating regions"
      signature: "PROCEDURE InitPort(port: GrafPtr)"
      parameters: [{ name: port, type: GrafPtr, direction: inout }]
      returnType: void
    - name: ClosePort
      category: port
      description: "Close port and release its regions"
      signature: "PROCEDURE ClosePort(port: GrafPtr)"
      parameters: [{ name: port, type: GrafPtr, direction: in }]
      returnType: void
    - name: SetPort
      category: port
      description: "Set the current graphics port for all subsequent QuickDraw calls"
      signature: "PROCEDURE SetPort(port: GrafPtr)"
      parameters: [{ name: port, type: GrafPtr, direction: in }]
      returnType: void
    - name: GetPort
      category: port
      description: "Return the current graphics port"
      signature: "FUNCTION GetPort(): GrafPtr"
      parameters: []
      returnType: GrafPtr
    - name: GrafDevice
      category: port
      description: "Set or get the current GrafDevice"
      signature: "PROCEDURE GrafDevice(device: Integer)"
      parameters: [{ name: device, type: Integer, direction: in }]
      returnType: void
    - name: SetPortBits
      category: port
      description: "Replace the current port's backing bitmap"
      signature: "PROCEDURE SetPortBits(bm: BitMap)"
      parameters: [{ name: bm, type: BitMap, direction: in }]
      returnType: void
    - name: PortSize
      category: port
      description: "Set port rectangle size"
      signature: "PROCEDURE PortSize(width, height: Integer)"
      parameters:
        [{ name: width, type: Integer }, { name: height, type: Integer }]
      returnType: void
    - name: MovePortTo
      category: port
      description: "Move port origin in global coordinates"
      signature: "PROCEDURE MovePortTo(leftGlobal, topGlobal: Integer)"
      parameters:
        [
          { name: leftGlobal, type: Integer },
          { name: topGlobal, type: Integer },
        ]
      returnType: void
    - name: SetOrigin
      category: port
      description: "Set the port's local coordinate origin"
      signature: "PROCEDURE SetOrigin(h, v: Integer)"
      parameters: [{ name: h, type: Integer }, { name: v, type: Integer }]
      returnType: void
    - name: SetClip
      category: port
      description: "Set the current port's clip region"
      signature: "PROCEDURE SetClip(rgn: RgnHandle)"
      parameters: [{ name: rgn, type: RgnHandle, direction: in }]
      returnType: void
    - name: GetClip
      category: port
      description: "Copy current clip region to destination"
      signature: "PROCEDURE GetClip(dstRgn: RgnHandle)"
      parameters: [{ name: dstRgn, type: RgnHandle, direction: out }]
      returnType: void
    - name: ClipRect
      category: port
      description: "Intersect clip region with the given rectangle"
      signature: "PROCEDURE ClipRect(r: Rect)"
      parameters: [{ name: r, type: Rect, direction: in }]
      returnType: void
    - name: BackPat
      category: port
      description: "Set the background pattern"
      signature: "PROCEDURE BackPat(pat: Pattern)"
      parameters: [{ name: pat, type: Pattern, direction: in }]
      returnType: void
    - name: newGrafPort
      category: port
      description: "Allocate and return a new initialized GrafPort (non-standard helper)"
      signature: "FUNCTION newGrafPort(): GrafPtr"
      parameters: []
      returnType: GrafPtr

    # Cursor
    - name: InitCursor
      category: cursor
      description: "Initialize the cursor to the arrow"
      signature: "PROCEDURE InitCursor"
      parameters: []
      returnType: void
    - name: SetCursor
      category: cursor
      description: "Set the current cursor shape"
      signature: "PROCEDURE SetCursor(crsr: Cursor)"
      parameters: [{ name: crsr, type: Cursor, direction: in }]
      returnType: void
    - name: HideCursor
      category: cursor
      description: "Hide the cursor (decrement visibility count)"
      signature: "PROCEDURE HideCursor"
      parameters: []
      returnType: void
    - name: ShowCursor
      category: cursor
      description: "Show the cursor (increment visibility count)"
      signature: "PROCEDURE ShowCursor"
      parameters: []
      returnType: void
    - name: ObscureCursor
      category: cursor
      description: "Hide cursor until mouse moves"
      signature: "PROCEDURE ObscureCursor"
      parameters: []
      returnType: void

    # Pen and lines
    - name: HidePen
      category: pen
      description: "Hide the pen for subsequent drawing"
      signature: "PROCEDURE HidePen"
      parameters: []
      returnType: void
    - name: ShowPen
      category: pen
      description: "Show the pen"
      signature: "PROCEDURE ShowPen"
      parameters: []
      returnType: void
    - name: GetPen
      category: pen
      description: "Return current pen position in pt"
      signature: "PROCEDURE GetPen(VAR pt: Point)"
      parameters: [{ name: pt, type: Point, direction: out }]
      returnType: void
    - name: GetPenState
      category: pen
      description: "Save current pen state to pnState"
      signature: "PROCEDURE GetPenState(VAR pnState: PenState)"
      parameters: [{ name: pnState, type: PenState, direction: out }]
      returnType: void
    - name: SetPenState
      category: pen
      description: "Restore pen state from pnState"
      signature: "PROCEDURE SetPenState(pnState: PenState)"
      parameters: [{ name: pnState, type: PenState, direction: in }]
      returnType: void
    - name: PenSize
      category: pen
      description: "Set pen width and height in pixels"
      signature: "PROCEDURE PenSize(width, height: Integer)"
      parameters:
        [{ name: width, type: Integer }, { name: height, type: Integer }]
      returnType: void
    - name: PenMode
      category: pen
      description: "Set transfer mode for pen drawing"
      signature: "PROCEDURE PenMode(mode: Integer)"
      parameters: [{ name: mode, type: Integer, direction: in }]
      returnType: void
    - name: PenPat
      category: pen
      description: "Set pen pattern"
      signature: "PROCEDURE PenPat(pat: Pattern)"
      parameters: [{ name: pat, type: Pattern, direction: in }]
      returnType: void
    - name: PenNormal
      category: pen
      description: "Reset pen to 1x1, patCopy, black"
      signature: "PROCEDURE PenNormal"
      parameters: []
      returnType: void
    - name: MoveTo
      category: line
      description: "Set pen position to (h, v)"
      signature: "PROCEDURE MoveTo(h, v: Integer)"
      parameters: [{ name: h, type: Integer }, { name: v, type: Integer }]
      returnType: void
    - name: Move
      category: line
      description: "Move pen by (dh, dv)"
      signature: "PROCEDURE Move(dh, dv: Integer)"
      parameters: [{ name: dh, type: Integer }, { name: dv, type: Integer }]
      returnType: void
    - name: LineTo
      category: line
      description: "Draw line from current pen position to (h, v)"
      signature: "PROCEDURE LineTo(h, v: Integer)"
      parameters: [{ name: h, type: Integer }, { name: v, type: Integer }]
      returnType: void
    - name: Line
      category: line
      description: "Draw line from current position by (dh, dv)"
      signature: "PROCEDURE Line(dh, dv: Integer)"
      parameters: [{ name: dh, type: Integer }, { name: dv, type: Integer }]
      returnType: void
    - name: StdLine
      category: line
      description: "Bottleneck line procedure"
      signature: "PROCEDURE StdLine(port: GrafPtr; newPt: Point)"
      parameters: [{ name: port, type: GrafPtr }, { name: newPt, type: Point }]
      returnType: void

    # Point and Rect (math)
    - name: SetPt
      category: point
      description: "Set point coordinates"
      signature: "PROCEDURE SetPt(VAR pt: Point; h, v: Integer)"
      parameters: []
      returnType: void
    - name: EqualPt
      category: point
      description: "Return TRUE if two points are equal"
      signature: "FUNCTION EqualPt(pt1, pt2: Point): Boolean"
      parameters: []
      returnType: Boolean
    - name: AddPt
      category: point
      description: "Add src to dst (in place)"
      signature: "PROCEDURE AddPt(src: Point; VAR dst: Point)"
      parameters: []
      returnType: void
    - name: SubPt
      category: point
      description: "Subtract src from dst (in place)"
      signature: "PROCEDURE SubPt(src: Point; VAR dst: Point)"
      parameters: []
      returnType: void
    - name: LocalToGlobal
      category: point
      description: "Convert point from local to global coordinates"
      signature: "PROCEDURE LocalToGlobal(VAR pt: Point)"
      parameters: []
      returnType: void
    - name: GlobalToLocal
      category: point
      description: "Convert point from global to local coordinates"
      signature: "PROCEDURE GlobalToLocal(VAR pt: Point)"
      parameters: []
      returnType: void
    - name: ScalePt
      category: point
      description: "Scale point by numer/denom"
      signature: "PROCEDURE ScalePt(VAR pt: Point; numer, denom: Point; vh: VHSelect)"
      parameters: []
      returnType: void
    - name: MapPt
      category: point
      description: "Map point from one rect to another"
      signature: "PROCEDURE MapPt(VAR pt: Point; fromRect, toRect: Rect)"
      parameters: []
      returnType: void
    - name: SetRect
      category: rect
      description: "Set rect to (left, top, right, bottom)"
      signature: "PROCEDURE SetRect(VAR r: Rect; left, top, right, bottom: Integer)"
      parameters: []
      returnType: void
    - name: EqualRect
      category: rect
      description: "Return TRUE if two rects are equal"
      signature: "FUNCTION EqualRect(rect1, rect2: Rect): Boolean"
      parameters: []
      returnType: Boolean
    - name: EmptyRect
      category: rect
      description: "Return TRUE if rect has no area"
      signature: "FUNCTION EmptyRect(r: Rect): Boolean"
      parameters: []
      returnType: Boolean
    - name: PtInRect
      category: rect
      description: "Return TRUE if point is inside rect"
      signature: "FUNCTION PtInRect(pt: Point; r: Rect): Boolean"
      parameters: []
      returnType: Boolean
    - name: OffsetRect
      category: rect
      description: "Move rect by (dh, dv)"
      signature: "PROCEDURE OffsetRect(VAR r: Rect; dh, dv: Integer)"
      parameters: []
      returnType: void
    - name: InsetRect
      category: rect
      description: "Inset rect edges by dh, dv"
      signature: "PROCEDURE InsetRect(VAR r: Rect; dh, dv: Integer)"
      parameters: []
      returnType: void
    - name: SectRect
      category: rect
      description: "Set dst to intersection of src1 and src2; return TRUE if not empty"
      signature: "FUNCTION SectRect(src1, src2: Rect; VAR dstRect: Rect): Boolean"
      parameters: []
      returnType: Boolean
    - name: UnionRect
      category: rect
      description: "Set dst to smallest rect containing both src1 and src2"
      signature: "PROCEDURE UnionRect(src1, src2: Rect; VAR dstRect: Rect)"
      parameters: []
      returnType: void
    - name: MapRect
      category: rect
      description: "Map rect from one coordinate system to another"
      signature: "PROCEDURE MapRect(VAR r: Rect; fromRect, toRect: Rect)"
      parameters: []
      returnType: void
    - name: Pt2Rect
      category: rect
      description: "Set dst to smallest rect containing pt1 and pt2"
      signature: "PROCEDURE Pt2Rect(pt1, pt2: Point; VAR dstRect: Rect)"
      parameters: []
      returnType: void

    # Rect drawing
    - name: StdRect
      category: drawing
      description: "Bottleneck rect procedure (verb: FRAME, PAINT, ERASE, INVERT, FILL)"
      signature: "PROCEDURE StdRect(verb: GrafVerb; r: Rect; fillPat: Pattern)"
      parameters: []
      returnType: void
    - name: FrameRect
      category: drawing
      description: "Draw outline of rect with current pen"
      signature: "PROCEDURE FrameRect(r: Rect)"
      parameters: [{ name: r, type: Rect, direction: in }]
      returnType: void
    - name: PaintRect
      category: drawing
      description: "Fill rect with current pen pattern"
      signature: "PROCEDURE PaintRect(r: Rect)"
      parameters: [{ name: r, type: Rect, direction: in }]
      returnType: void
    - name: EraseRect
      category: drawing
      description: "Fill rect with background pattern"
      signature: "PROCEDURE EraseRect(r: Rect)"
      parameters: [{ name: r, type: Rect, direction: in }]
      returnType: void
    - name: InvertRect
      category: drawing
      description: "Invert all pixels in rect"
      signature: "PROCEDURE InvertRect(r: Rect)"
      parameters: [{ name: r, type: Rect, direction: in }]
      returnType: void
    - name: FillRect
      category: drawing
      description: "Fill rect with given pattern"
      signature: "PROCEDURE FillRect(r: Rect; pat: Pattern)"
      parameters: [{ name: r, type: Rect }, { name: pat, type: Pattern }]
      returnType: void

    # RoundRect, Oval, Arc
    - name: FrameRoundRect
      category: drawing
      description: "Draw rounded rectangle outline"
      signature: "PROCEDURE FrameRoundRect(r: Rect; ovWd, ovHt: Integer)"
      parameters: []
      returnType: void
    - name: PaintRoundRect
      category: drawing
      description: "Fill rounded rectangle"
      signature: "PROCEDURE PaintRoundRect(r: Rect; ovWd, ovHt: Integer)"
      parameters: []
      returnType: void
    - name: EraseRoundRect
      category: drawing
      description: "Erase rounded rectangle with background pattern"
      signature: "PROCEDURE EraseRoundRect(r: Rect; ovWd, ovHt: Integer)"
      parameters: []
      returnType: void
    - name: InvertRoundRect
      category: drawing
      description: "Invert pixels in rounded rectangle"
      signature: "PROCEDURE InvertRoundRect(r: Rect; ovWd, ovHt: Integer)"
      parameters: []
      returnType: void
    - name: FillRoundRect
      category: drawing
      description: "Fill rounded rectangle with pattern"
      signature: "PROCEDURE FillRoundRect(r: Rect; ovWd, ovHt: Integer; pat: Pattern)"
      parameters: []
      returnType: void
    - name: FrameOval
      category: drawing
      description: "Draw oval outline in rect"
      signature: "PROCEDURE FrameOval(r: Rect)"
      parameters: []
      returnType: void
    - name: PaintOval
      category: drawing
      description: "Fill oval"
      signature: "PROCEDURE PaintOval(r: Rect)"
      parameters: []
      returnType: void
    - name: EraseOval
      category: drawing
      description: "Erase oval with background pattern"
      signature: "PROCEDURE EraseOval(r: Rect)"
      parameters: []
      returnType: void
    - name: InvertOval
      category: drawing
      description: "Invert oval pixels"
      signature: "PROCEDURE InvertOval(r: Rect)"
      parameters: []
      returnType: void
    - name: FillOval
      category: drawing
      description: "Fill oval with pattern"
      signature: "PROCEDURE FillOval(r: Rect; pat: Pattern)"
      parameters: []
      returnType: void
    - name: FrameArc
      category: drawing
      description: "Draw arc outline"
      signature: "PROCEDURE FrameArc(r: Rect; startAngle, arcAngle: Integer)"
      parameters: []
      returnType: void
    - name: PaintArc
      category: drawing
      description: "Fill arc"
      signature: "PROCEDURE PaintArc(r: Rect; startAngle, arcAngle: Integer)"
      parameters: []
      returnType: void
    - name: EraseArc
      category: drawing
      description: "Erase arc"
      signature: "PROCEDURE EraseArc(r: Rect; startAngle, arcAngle: Integer)"
      parameters: []
      returnType: void
    - name: InvertArc
      category: drawing
      description: "Invert arc"
      signature: "PROCEDURE InvertArc(r: Rect; startAngle, arcAngle: Integer)"
      parameters: []
      returnType: void
    - name: FillArc
      category: drawing
      description: "Fill arc with pattern"
      signature: "PROCEDURE FillArc(r: Rect; startAngle, arcAngle: Integer; pat: Pattern)"
      parameters: []
      returnType: void
    - name: PtToAngle
      category: drawing
      description: "Return angle in degrees from rect center to point"
      signature: "FUNCTION PtToAngle(r: Rect; pt: Point): Integer"
      parameters: []
      returnType: Integer

    # Polygon
    - name: OpenPoly
      category: polygon
      description: "Start recording a new polygon"
      signature: "FUNCTION OpenPoly(): PolyHandle"
      parameters: []
      returnType: PolyHandle
    - name: ClosePoly
      category: polygon
      description: "Finish recording polygon"
      signature: "PROCEDURE ClosePoly"
      parameters: []
      returnType: void
    - name: KillPoly
      category: polygon
      description: "Dispose of polygon"
      signature: "PROCEDURE KillPoly(poly: PolyHandle)"
      parameters: []
      returnType: void
    - name: OffsetPoly
      category: polygon
      description: "Move polygon by (dh, dv)"
      signature: "PROCEDURE OffsetPoly(poly: PolyHandle; dh, dv: Integer)"
      parameters: []
      returnType: void
    - name: MapPoly
      category: polygon
      description: "Map polygon from one rect to another"
      signature: "PROCEDURE MapPoly(poly: PolyHandle; fromRect, toRect: Rect)"
      parameters: []
      returnType: void
    - name: FramePoly
      category: polygon
