  - id: event-manager
    name: "Event Manager"
    description: "Communicates user actions (key, mouse) and app status (update, activate) to the application. Toolbox Event Manager + OS Event Manager (event queue)."

    types:
      - name: EventRecord
        kind: record
        description: "One event from the queue"
        fields:
          - {
              name: what,
              type: Integer,
              description: "Event type (mouseDown, keyDown, updateEvt, etc.)",
            }
          - {
              name: message,
              type: LongInt,
              description: "Event-specific (e.g. window ptr, key code)",
            }
          - { name: when, type: LongInt, description: "Ticks since boot" }
          - {
              name: where,
              type: Point,
              description: "Mouse position in global coords",
            }
          - {
              name: modifiers,
              type: Integer,
              description: "Modifier keys and mouse button state",
            }

    constants:
      - { name: mouseDown, value: 1, description: "Mouse button pressed" }
      - { name: mouseUp, value: 2, description: "Mouse button released" }
      - { name: keyDown, value: 3, description: "Key pressed" }
      - { name: keyUp, value: 4, description: "Key released" }
      - { name: autoKey, value: 5, description: "Auto-key repeat" }
      - {
          name: updateEvt,
          value: 6,
          description: "Window content needs redraw",
        }
      - { name: diskEvt, value: 7, description: "Disk inserted/ejected" }
      - {
          name: activateEvt,
          value: 8,
          description: "Window activated or deactivated",
        }
      - { name: inDesk, value: 0, description: "FindWindow: in desktop" }
      - { name: inMenuBar, value: 1, description: "FindWindow: in menu bar" }
      - {
          name: inSysWindow,
          value: 2,
          description: "FindWindow: in system window",
        }
      - { name: inContent, value: 3, description: "FindWindow: in content" }
      - { name: inDrag, value: 4, description: "FindWindow: in drag region" }
      - { name: inGrow, value: 5, description: "FindWindow: in grow region" }
      - { name: inGoAway, value: 6, description: "FindWindow: in close box" }
      - { name: inZoomIn, value: 7, description: "FindWindow: in zoom in" }
      - { name: inZoomOut, value: 8, description: "FindWindow: in zoom out" }

    routines:
      - name: GetNextEvent
        category: event-loop
        description: "Get next event matching mask; return TRUE if event found"
        signature: "FUNCTION GetNextEvent(eventMask: Integer; VAR theEvent: EventRecord): Boolean"
        parameters: []
        returnType: Boolean
      - name: WaitNextEvent
        category: event-loop
        description: "Wait for event (with sleep); return TRUE if event found"
        signature: "FUNCTION WaitNextEvent(eventMask: Integer; VAR theEvent: EventRecord; sleep: LongInt; mouseRgn: RgnHandle): Boolean"
        parameters: []
        returnType: Boolean
      - name: EventAvail
        category: event-loop
        description: "Check if event of type in mask is available (non-blocking)"
        signature: "FUNCTION EventAvail(eventMask: Integer; VAR theEvent: EventRecord): Boolean"
        parameters: []
        returnType: Boolean
      - name: GetMouse
        category: mouse
        description: "Return current mouse position in global coordinates"
        signature: "PROCEDURE GetMouse(VAR thePoint: Point)"
        parameters: []
        returnType: void
      - name: Button
        category: mouse
        description: "Return TRUE if mouse button is down"
        signature: "FUNCTION Button(): Boolean"
        parameters: []
        returnType: Boolean
      - name: StillDown
        category: mouse
        description: "Return TRUE if button still down (after initial press)"
        signature: "FUNCTION StillDown(): Boolean"
        parameters: []
        returnType: Boolean
      - name: TickCount
        category: time
        description: "Return ticks since system startup"
        signature: "FUNCTION TickCount(): LongInt"
        parameters: []
        returnType: LongInt

