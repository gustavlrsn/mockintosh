# ---------------------------------------------------------------------------
# Toolbox Managers
# ---------------------------------------------------------------------------
managers:
  - id: window-manager
    name: "Window Manager"
    description: "Creates, moves, resizes, and manages the layering of windows; maintains the gray region (desktop). Window chrome is drawn by Window Definition Functions using QuickDraw."

    types:
      - name: WindowRecord
        kind: record
        description: "Monochrome window record; first field is GrafPort so WindowPtr = GrafPtr"
        fields:
          - { name: port, type: GrafPort }
          - {
              name: windowKind,
              type: Integer,
              description: "e.g. userKind, dialogKind",
            }
          - { name: visible, type: Boolean }
          - { name: hilited, type: Boolean }
          - {
              name: goAwayFlag,
              type: Boolean,
              description: "TRUE if close box",
            }
          - { name: spareFlag, type: Boolean, description: "TRUE if zoom box" }
          - {
              name: strucRgn,
              type: RgnHandle,
              description: "Entire window area",
            }
          - { name: contRgn, type: RgnHandle, description: "Content region" }
          - {
              name: updateRgn,
              type: RgnHandle,
              description: "Area needing redraw",
            }
          - {
              name: windowDefProc,
              type: Handle,
              description: "Window definition function",
            }
          - {
              name: dataHandle,
              type: Handle,
              description: "e.g. WStateData for zoom",
            }
          - { name: titleHandle, type: StringHandle }
          - { name: titleWidth, type: Integer }
          - { name: controlList, type: ControlHandle }
          - { name: nextWindow, type: WindowPeek }
          - {
              name: windowPic,
              type: PicHandle,
              description: "Optional for auto-update",
            }
          - { name: refCon, type: LongInt }
      - name: WindowPtr
        kind: type
        description: "Pointer to window; same as GrafPtr (port is first field)"
      - name: WindowPeek
        kind: type
        description: "Pointer to full WindowRecord for accessing fields beyond the port"

    routines:
      - name: GetNewWindow
        category: creation
        description: "Create window from WIND resource"
        signature: "FUNCTION GetNewWindow(windowID: Integer; wStorage: Ptr; behind: WindowPtr): WindowPtr"
        parameters:
          - { name: windowID, type: Integer }
          - { name: wStorage, type: Ptr }
          - { name: behind, type: WindowPtr }
        returnType: WindowPtr
      - name: NewWindow
        category: creation
        description: "Create window with explicit parameters"
        signature: "FUNCTION NewWindow(wStorage: Ptr; boundsRect: Rect; title: Str255; visible: Boolean; theProc: Integer; behind: WindowPtr; goAwayFlag: Boolean; refCon: LongInt): WindowPtr"
        parameters: []
        returnType: WindowPtr
      - name: GetNewCWindow
        category: creation
        description: "Create color window from resource"
        signature: "FUNCTION GetNewCWindow(windowID: Integer; wStorage: Ptr; behind: WindowPtr): WindowPtr"
        parameters: []
        returnType: WindowPtr
      - name: NewCWindow
        category: creation
        description: "Create color window with explicit parameters"
        signature: "FUNCTION NewCWindow(wStorage: Ptr; boundsRect: Rect; title: Str255; visible: Boolean; procID: Integer; behind: WindowPtr; goAwayFlag: Boolean; refCon: LongInt): WindowPtr"
        parameters: []
        returnType: WindowPtr
      - name: ShowWindow
        category: visibility
        description: "Display a window"
        signature: "PROCEDURE ShowWindow(theWindow: WindowPtr)"
        parameters: [{ name: theWindow, type: WindowPtr }]
        returnType: void
      - name: HideWindow
        category: visibility
        description: "Hide a window"
        signature: "PROCEDURE HideWindow(theWindow: WindowPtr)"
        parameters: [{ name: theWindow, type: WindowPtr }]
        returnType: void
      - name: ShowHide
        category: visibility
        description: "Show or hide window according to flag"
        signature: "PROCEDURE ShowHide(theWindow: WindowPtr; showFlag: Boolean)"
        parameters: []
        returnType: void
      - name: SelectWindow
        category: activation
        description: "Make window active, bring to front, highlight"
        signature: "PROCEDURE SelectWindow(theWindow: WindowPtr)"
        parameters: [{ name: theWindow, type: WindowPtr }]
        returnType: void
      - name: FrontWindow
        category: activation
        description: "Return the frontmost (active) window"
        signature: "FUNCTION FrontWindow(): WindowPtr"
        parameters: []
        returnType: WindowPtr
      - name: BringToFront
        category: activation
        description: "Move window to front of list without changing highlight"
        signature: "PROCEDURE BringToFront(theWindow: WindowPtr)"
        parameters: []
        returnType: void
      - name: SendBehind
        category: activation
        description: "Move window behind another"
        signature: "PROCEDURE SendBehind(theWindow, behindWindow: WindowPtr)"
        parameters: []
        returnType: void
      - name: HiliteWindow
        category: activation
        description: "Set or clear window highlight"
        signature: "PROCEDURE HiliteWindow(theWindow: WindowPtr; fHilite: Boolean)"
        parameters: []
        returnType: void
      - name: DragWindow
        category: move-resize
        description: "Track window drag from startPt, constrained by boundsRect"
        signature: "PROCEDURE DragWindow(theWindow: WindowPtr; startPt: Point; boundsRect: Rect)"
        parameters: []
        returnType: void
      - name: MoveWindow
        category: move-resize
        description: "Move window to (hGlobal, vGlobal)"
        signature: "PROCEDURE MoveWindow(theWindow: WindowPtr; hGlobal, vGlobal: Integer; front: Boolean)"
        parameters: []
        returnType: void
      - name: GrowWindow
        category: move-resize
        description: "Track grow box; return new size"
        signature: "FUNCTION GrowWindow(theWindow: WindowPtr; startPt: Point; sizeRect: Rect): LongInt"
        parameters: []
        returnType: LongInt
      - name: SizeWindow
        category: move-resize
        description: "Resize window to w x h"
        signature: "PROCEDURE SizeWindow(theWindow: WindowPtr; w, h: Integer; fUpdate: Boolean)"
        parameters: []
        returnType: void
      - name: TrackBox
        category: zoom
        description: "Track zoom box click; return TRUE if zoom"
        signature: "FUNCTION TrackBox(theWindow: WindowPtr; thePt: Point; partCode: Integer): Boolean"
        parameters: []
        returnType: Boolean
      - name: ZoomWindow
        category: zoom
        description: "Zoom window to user or standard state"
        signature: "PROCEDURE ZoomWindow(theWindow: WindowPtr; partCode: Integer; front: Boolean)"
        parameters: []
        returnType: void
      - name: TrackGoAway
        category: close
        description: "Track close box; return TRUE if close"
        signature: "FUNCTION TrackGoAway(theWindow: WindowPtr; thePt: Point): Boolean"
        parameters: []
        returnType: Boolean
      - name: CloseWindow
        category: close
        description: "Remove window from screen; does not dispose WindowRecord"
        signature: "PROCEDURE CloseWindow(theWindow: WindowPtr)"
        parameters: []
        returnType: void
      - name: DisposeWindow
        category: close
        description: "Close window and release WindowRecord memory"
        signature: "PROCEDURE DisposeWindow(theWindow: WindowPtr)"
        parameters: []
        returnType: void
      - name: BeginUpdate
        category: update
        description: "Begin redrawing; set clip to update region"
        signature: "PROCEDURE BeginUpdate(theWindow: WindowPtr)"
        parameters: []
        returnType: void
      - name: EndUpdate
        category: update
        description: "End redrawing"
        signature: "PROCEDURE EndUpdate(theWindow: WindowPtr)"
        parameters: []
        returnType: void
      - name: InvalRect
        category: update
        description: "Mark rect as needing redraw"
        signature: "PROCEDURE InvalRect(badRect: Rect)"
        parameters: []
        returnType: void
      - name: InvalRgn
        category: update
        description: "Mark region as needing redraw"
        signature: "PROCEDURE InvalRgn(badRgn: RgnHandle)"
        parameters: []
        returnType: void
      - name: ValidRect
        category: update
        description: "Mark rect as valid (no redraw needed)"
        signature: "PROCEDURE ValidRect(goodRect: Rect)"
        parameters: []
        returnType: void
      - name: ValidRgn
        category: update
        description: "Mark region as valid"
        signature: "PROCEDURE ValidRgn(goodRgn: RgnHandle)"
        parameters: []
        returnType: void
      - name: FindWindow
        category: misc
        description: "Identify which part of which window was clicked; return part code"
        signature: "FUNCTION FindWindow(thePoint: Point; VAR theWindow: WindowPtr): Integer"
        parameters: []
        returnType: Integer
      - name: GetWTitle
        category: misc
        description: "Get window title"
        signature: "PROCEDURE GetWTitle(theWindow: WindowPtr; VAR title: Str255)"
        parameters: []
        returnType: void
      - name: SetWTitle
        category: misc
        description: "Set window title"
        signature: "PROCEDURE SetWTitle(theWindow: WindowPtr; title: Str255)"
        parameters: []
        returnType: void
      - name: GetWRefCon
        category: misc
        description: "Get window reference constant"
        signature: "FUNCTION GetWRefCon(theWindow: WindowPtr): LongInt"
        parameters: []
        returnType: LongInt
      - name: SetWRefCon
        category: misc
        description: "Set window reference constant"
        signature: "PROCEDURE SetWRefCon(theWindow: WindowPtr; data: LongInt)"
        parameters: []
        returnType: void
      - name: GetWVariant
        category: misc
        description: "Get window variant"
        signature: "FUNCTION GetWVariant(theWindow: WindowPtr): Integer"
        parameters: []
        returnType: Integer
      - name: DrawGrowIcon
        category: misc
        description: "Draw size box and scroll bar outlines"
        signature: "PROCEDURE DrawGrowIcon(theWindow: WindowPtr)"
        parameters: []
        returnType: void

  - id: control-manager
    name: "Control Manager"
    description: "Creates and manipulates onscreen controls (buttons, checkboxes, radio buttons, scroll bars). Draws via QuickDraw (CDEF); applications use DrawControl/UpdateControls."

    types:
      - name: ControlHandle
        kind: handle
        baseType: ControlRecord
        description: "Handle to a control"
      - name: ControlRecord
        kind: record
        description: "Control definition; kind (pushButton, checkBox, radioButton, etc.), bounds, value, min, max, refCon"

    routines:
      - name: NewControl
        category: creation
        description: "Create control with explicit parameters"
        signature: "FUNCTION NewControl(theWindow: WindowPtr; boundsRect: Rect; title: Str255; visible: Boolean; value, min, max, procID: Integer; refCon: LongInt): ControlHandle"
        parameters: []
        returnType: ControlHandle
      - name: GetNewControl
        category: creation
