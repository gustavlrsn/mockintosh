<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockintosh — 3D</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a1a1a; min-height: 100vh; overflow: hidden; }
      #root { position: absolute; left: -9999px; top: -9999px; }
      #three-root { width: 100vw; height: 100vh; }
      canvas { display: block; }
      .controls {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .ctrl-btn {
        height: 40px;
        border: none;
        border-radius: 20px;
        background: #333;
        color: #ccc;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        transition: background 0.2s, color 0.2s;
        padding: 0 14px;
        font-family: system-ui, sans-serif;
      }
      .ctrl-btn:hover { background: #444; }
      #power-btn { width: 40px; padding: 0; border-radius: 50%; color: #8f8; font-size: 20px; }
      #power-btn.off { color: #666; }
      #brightness {
        -webkit-appearance: none;
        appearance: none;
        width: 100px;
        height: 6px;
        border-radius: 3px;
        background: #444;
        outline: none;
        cursor: pointer;
      }
      #brightness::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ccc;
        cursor: pointer;
      }
      .brightness-label {
        color: #888;
        font-size: 12px;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="controls">
      <button id="power-btn" class="ctrl-btn" title="Power">&#x23FB;</button>
      <span class="brightness-label">☀</span>
      <input id="brightness" type="range" min="0.2" max="3.0" step="0.1" value="1.2" title="Screen brightness">
    </div>
    <div id="three-root"></div>
    <script type="module" src="/src/3d/main.ts"></script>
  </body>
</html>
