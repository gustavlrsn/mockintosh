<h1>Installing and running the project locally</h1>
<p>Install <a href="https://nodejs.org/en/download/">node + npm</a> and <a href="https://git-scm.com/downloads">git</a> if you haven't already, and then run</p>
<pre><code>git clone https://github.com/gustavlrsn/mockintosh
cd mockintosh
npm install
npm run dev
</code></pre>
